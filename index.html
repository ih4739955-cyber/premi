<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Premi</title>

  <link rel="stylesheet" href="src/style.css">

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

  <header class="topbar">
    <div>
      <h1>Premi</h1>
      <p>Earn • Complete • Reward</p>
    </div>
  </header>

  <main>

    <section class="balance-card">
      <p>Current Balance</p>
      <h2>৳<span id="balance">36.80</span></h2>
      <p><span id="coins">40</span> Coins</p>
    </section>

    <section class="quick-actions">
      <a href="tasks.html" class="action-card">
        <span>🎯</span>
        <strong>Tasks</strong>
        <small>Watch Ads</small>
      </a>

      <div class="action-card">
        <span>💰</span>
        <strong>Withdraw</strong>
        <small>Coming Soon</small>
      </div>

      <div class="action-card">
        <span>👤</span>
        <strong>Profile</strong>
        <small>Account</small>
      </div>
    </section>

    <section class="progress-card">
      <div class="progress-header">
        <h3>Daily Progress</h3>
        <strong id="progressPercent">53%</strong>
      </div>

      <div class="progress-bar">
        <div
          class="progress-fill"
          id="progressFill"
          style="width: 53%;">
        </div>
      </div>

      <p id="progressText">
        আজকের Daily Tasks সম্পন্ন করুন 🎯
      </p>
    </section>

    <section class="stats">
      <div>
        <strong id="completedAds">8</strong>
        <span>Ads Completed</span>
      </div>

      <div>
        <strong>15</strong>
        <span>Daily Limit</span>
      </div>

      <div>
        <strong>৳4.60</strong>
        <span>Per Ad</span>
      </div>
    </section>

  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="active">
      🏠
      <span>Home</span>
    </a>

    <a href="tasks.html">
      🎯
      <span>Tasks</span>
    </a>

    <a href="#">
      💰
      <span>Wallet</span>
    </a>

    <a href="#">
      👤
      <span>Profile</span>
    </a>
  </nav>

  <script src="src/app.js"></script>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();

      console.log("Premi Telegram Mini App চালু হয়েছে 🚀");
    }
  </script>

</body>
</html>
